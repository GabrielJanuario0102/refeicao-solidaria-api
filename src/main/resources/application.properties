spring.application.name=refeicao-solidaria-api
server.port=8080

# PostgreSQL do Docker Compose criado na Sprint 1.
# A porta no computador é 5444 (dentro do container é 5432).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5444/refeicaosolidaria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Desenvolvimento local: o Hibernate atualiza a estrutura existente.
# Em produção, substituir por migrações controladas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
